name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo (audit + tests).
permissions:
  contents: read

jobs:
  audit-python-api:
    name: Python audit (main API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Audit main API dependencies
        working-directory: apps/api
        run: uv run --with pip-audit pip-audit --requirement <(uv export --no-hashes) --format cyclonedx-json

  audit-python-admin-api:
    name: Python audit (admin API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Audit admin API dependencies
        working-directory: apps/admin-api
        run: uv run --with pip-audit pip-audit --requirement <(uv export --frozen --no-hashes) --format cyclonedx-json

  audit-npm-admin:
    name: npm audit (admin frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci --no-fund
      - name: npm audit
        working-directory: apps/admin
        run: npm audit --audit-level=high

  audit-npm-customer:
    name: npm audit (customer frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund
      - name: npm audit
        run: npm audit --audit-level=high

  test-python-api:
    name: Pytest (main API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync
      - name: Run tests
        working-directory: apps/api
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SECRET_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          GEMINI_API_KEY: dummy
          INTERNAL_API_SECRET: dummy-secret-for-ci
        run: uv run pytest -q -m "not integration" --tb=short

  typecheck-admin:
    name: TypeScript check (admin frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install
        working-directory: apps/admin
        run: npm ci --no-fund
      - name: Typecheck
        working-directory: apps/admin
        run: npx tsc --noEmit

  typecheck-customer:
    name: TypeScript check (customer frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-fund
      - name: Typecheck
        run: npx tsc --noEmit

  # --- "Judge" deterministic quality gate (see scripts/ + pyproject [tool.ruff]) ---

  lint-python:
    name: Ruff lint (both APIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.10.10"
      - name: Lint main API
        working-directory: apps/api
        run: uvx ruff check src
      - name: Lint admin API
        working-directory: apps/admin-api
        run: uvx ruff check src

  secret-scan:
    name: Secret scan (committed credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked files for secrets
        run: bash scripts/scan-secrets.sh

  admin-parity:
    name: Admin Portal parity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check admin-portal parity (CLAUDE.md rule)
        run: bash scripts/check-admin-parity.sh
