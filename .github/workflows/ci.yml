name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-python-api:
    name: Python audit (main API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Audit main API dependencies
        working-directory: apps/api
        run: uv run --with pip-audit pip-audit --requirement <(uv export --no-hashes) --format cyclonedx-json

  audit-python-admin-api:
    name: Python audit (admin API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"
      - name: Install pip-audit
        run: uv tool install pip-audit
      - name: Audit admin API dependencies
        working-directory: apps/admin-api
        run: uv run --with pip-audit pip-audit --requirement <(uv export --frozen --no-hashes) --format cyclonedx-json

  audit-npm-admin:
    name: npm audit (admin frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install dependencies
        working-directory: apps/admin
        run: npm ci --no-fund
      - name: npm audit
        working-directory: apps/admin
        run: npm audit --audit-level=high

  audit-npm-customer:
    name: npm audit (customer frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund
      - name: npm audit
        run: npm audit --audit-level=high

  test-python-api:
    name: Pytest (main API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync
      - name: Run tests
        working-directory: apps/api
        env:
          SUPABASE_URL: http://localhost
          SUPABASE_SECRET_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          STRIPE_SECRET_KEY: dummy
          STRIPE_WEBHOOK_SECRET: dummy
          GEMINI_API_KEY: dummy
          INTERNAL_API_SECRET: dummy-secret-for-ci
        run: uv run pytest -q -m "not integration" --tb=short

  typecheck-admin:
    name: TypeScript check (admin frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install
        working-directory: apps/admin
        run: npm ci --no-fund
      - name: Typecheck
        working-directory: apps/admin
        run: npx tsc --noEmit
