name: Deploy

# Runs ONLY after the "CI" workflow finishes successfully on main.
# This chaining means a red build never reaches production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never run two deploys at once (a second push waits for the first to finish).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to Hetzner
    # Guard: only deploy when CI actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }} # server public IP / hostname
          username: ${{ secrets.SSH_USER }} # deploy user (e.g. "deploy")
          key: ${{ secrets.SSH_KEY }} # private SSH key (PEM contents)
          port: ${{ secrets.SSH_PORT }} # optional; defaults to 22 if unset
          script: |
            set -euo pipefail
            cd /opt/hakkiu
            echo "→ Pulling latest main…"
            git fetch --all --prune
            git reset --hard origin/main   # .env is git-ignored, so it survives
            echo "→ Rebuilding + restarting containers…"
            docker compose build
            docker compose up -d
            echo "→ Pruning old images…"
            docker image prune -f
            echo "✓ Deploy complete."
