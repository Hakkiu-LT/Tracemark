name: Claude PR Review

# The "smart" layer of the judge: on every PR, Claude reads the diff and posts
# review comments. It automatically follows repo CLAUDE.md + REVIEW.md, so it
# enforces our conventions (admin parity, no leaked secrets, tenant scoping)
# that grep/ruff cannot reason about.
#
# ⚠️ REQUIRES a repo secret `ANTHROPIC_API_KEY` (Settings → Secrets and
# variables → Actions). Until that secret exists this workflow no-ops/fails
# fast — it does NOT block merges (it is intentionally not a required check).

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read # read the diff
  pull-requests: write # post review comments

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    # Skip drafts to save API credits; convert draft → ready to trigger a review.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so Claude can diff against the base branch
      # Skip cleanly (job stays GREEN) until the ANTHROPIC_API_KEY secret exists,
      # so this never shows a permanent red check that trains people to ignore CI.
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set — skipping Claude review. Add it in Settings → Secrets and variables → Actions to enable."
          fi
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Bound cost/time per PR. Widen if reviews feel shallow on big PRs.
          claude_args: "--max-turns 12"
          prompt: |
            Review this pull request for the HAKKIU monorepo. Follow REVIEW.md
            and CLAUDE.md in the repo root as the source of truth. Focus on:
            - Correctness and security bugs (auth/tenant leaks, SSRF, injection).
            - The MANDATORY admin-portal parity rule: any change to customer data
              in apps/api or customer src/ must also be wired into apps/admin-api
              (route + write_audit_log) and a permission key.
            - No secrets/keys committed; credentials belong only in the root .env.
            Report only high-signal findings. Prefer a short review over nitpicks.
