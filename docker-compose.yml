# Cap container logs so they can't grow unbounded and fill the 80 GB disk.
# 3 files × 10 MB = max 30 MB of logs per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: tracemark-api
    # Bind to 127.0.0.1 only — API is not directly internet-facing; frontend proxy handles routing
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - tracemark
    restart: unless-stopped
    logging: *default-logging
    # Load ALL root .env vars into the container (Stripe billing, Resend email,
    # CUSTOMER_APP_URL, etc.). Without this only the vars listed under `environment:`
    # would reach the API, silently breaking billing + email in production.
    env_file:
      - .env
    # These take precedence over env_file — they REMAP names the API expects
    # (SUPABASE_URL ← VITE_SUPABASE_URL, service-role key ← SUPABASE_SECRET_KEY).
    environment:
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - META_ADS_ACCESS_TOKEN=${META_ADS_ACCESS_TOKEN}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY}}
      - GOOGLE_SERP_API=${GOOGLE_SERP_API}
      - SEARCHCANS_API=${SEARCHCANS_API}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      # Shared secret so the admin-api can call the main API's /internal/* endpoints.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}

  admin-api:
    build:
      context: ./apps/admin-api
      dockerfile: Dockerfile
    image: tracemark-admin-api
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - api
    networks:
      - tracemark
    restart: unless-stopped
    logging: *default-logging
    # Same reasoning as `api`: load the shared root .env, then remap below.
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY}}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # Reach the main API over the internal docker network.
      - MAIN_API_URL=http://api:8000/api/v1
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-}

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
      # VITE_* are baked into the JS bundle at BUILD time — they must be present here,
      # not just at runtime. docker-compose reads them from the root .env.
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.hakkiu.com/api/v1}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        # Baked into the bundle — src/lib/stripe.ts reads it for Stripe checkout.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    image: tracemark-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    networks:
      - tracemark
    restart: unless-stopped
    logging: *default-logging

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:8001/api/v1}
    image: tracemark-admin
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      - admin-api
    networks:
      - tracemark
    restart: unless-stopped
    logging: *default-logging

  # Reverse proxy + automatic HTTPS. The ONLY service exposed to the internet.
  # Routes each subdomain to the matching container over the internal network.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Let's Encrypt certs + ACME state (persist!)
      - caddy_config:/config
    depends_on:
      - frontend
      - admin
      - api
      - admin-api
    networks:
      - tracemark
    restart: unless-stopped
    logging: *default-logging

networks:
  tracemark:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
