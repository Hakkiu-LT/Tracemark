services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: tracemark-api
    # Bind to 127.0.0.1 only — API is not directly internet-facing; frontend proxy handles routing
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - tracemark
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - META_ADS_ACCESS_TOKEN=${META_ADS_ACCESS_TOKEN}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SECRET_KEY}
      - GOOGLE_SERP_API=${GOOGLE_SERP_API}
      - SEARCHCANS_API=${SEARCHCANS_API}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: tracemark-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    networks:
      - tracemark
    restart: unless-stopped

networks:
  tracemark:
    driver: bridge
