[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemark-api"
version = "0.1.0"
description = "Python backend for Tracemark scraping, AI processing, and API endpoints."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.8",
  "langgraph>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
