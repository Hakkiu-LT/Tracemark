[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemark-api"
version = "0.1.0"
description = "Python backend for HAKKIU scraping, AI processing, and API endpoints."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.8",
  "langgraph>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "supabase>=2.0.0",
  "requests>=2.31.0",
  "python-whois>=0.9.0",
  "playwright>=1.40.0",
  "Pillow>=10.0.0",
  "imagehash>=4.3.1",
  "rapidfuzz>=3.0.0",
  "stripe>=11.0.0",
  "psutil>=5.9.0",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
