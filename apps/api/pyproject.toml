[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemark-api"
version = "0.1.0"
description = "Python backend for HAKKIU scraping, AI processing, and API endpoints."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic[email]>=2.8",
  "langgraph>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "supabase>=2.0.0",
  "requests>=2.31.0",
  "python-whois>=0.9.0",
  "playwright>=1.40.0",
  "Pillow>=10.0.0",
  "imagehash>=4.3.1",
  "rapidfuzz>=3.0.0",
  "psutil>=5.9.0",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "resend>=2.0.0",
  "imap-tools>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "integration: tests that require real API keys or network access (skip in CI)",
]

[tool.pyright]
extraPaths = ["src", "."]


[tool.ruff]
# Minimal, high-signal "judge" ruleset. Kept intentionally small so it catches
# real problems (undefined names, unused imports, syntax errors, import order)
# without drowning the team in stylistic churn on a FastAPI codebase. Widen the
# `select` list deliberately over time — do not enable the full default set,
# which flags the standard FastAPI `Depends()` idiom (B008) as a violation.
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E9 = syntax errors, F = pyflakes (undefined names, unused imports/vars),
# I = import sorting. All enforced in CI (see .github/workflows/ci.yml).
select = ["E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
